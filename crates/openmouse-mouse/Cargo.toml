[package]
name = "openmouse-mouse"
version = "0.0.1"
description = "Mouse support: device discovery and the QuickJS host for @openmouse/protocol"
edition = "2021"

[dependencies]
openmouse-hid = { version = "0.0.1", path = "../openmouse-hid" }
futures = "0.3.34"
rquickjs = { version = "0.14", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
futures-timer = "3.0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
